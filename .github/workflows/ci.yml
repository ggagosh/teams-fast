name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: macos-latest
    timeout-minutes: 60
    env:
      CARGO_INCREMENTAL: 0
      CARGO_NET_RETRY: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Check native updater integration
        run: |
          export SPARKLE_FRAMEWORK_PATH="$(scripts/setup_sparkle.sh)"
          cargo clippy --workspace --all-targets --features auto-update --locked -- -D warnings
      - name: Relay tests
        run: cargo test -p teamsfast-relay --locked
      - name: Relay builds alone from relay/Cargo.lock (as in its Dockerfile)
        working-directory: relay
        run: cargo check --locked --target-dir ../target/relay-alone
